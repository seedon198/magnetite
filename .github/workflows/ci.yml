name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
# NOTE: do not set a global RUSTFLAGS here. As an env var it *replaces* (does
# not merge with) the `[target.x86_64-unknown-none]` rustflags in
# .cargo/config.toml, which carry the kernel's linker script and relocation
# model - clobbering them breaks the higher-half link. Warnings are gated by
# the clippy steps below (`-D warnings`), which also catch rustc warnings.

jobs:
  # Format, lint, and cross-compile the kernel. The toolchain, components and
  # target are pinned by rust-toolchain.toml, which `rustup show` installs.
  build-lint:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version && cargo --version

      - name: rustfmt
        run: cargo fmt --all --check

      # Bare-metal crates: lint for the kernel target. No `--all-targets`: the
      # test harness needs std and cannot build for a no_std bare-metal target.
      - name: clippy (bare metal)
        run: >
          cargo clippy
          -p kernel -p hal -p boot-info -p sys -p user-root -p user-fault
          --target x86_64-unknown-none
          -- -D warnings

      # Host crates and their unit tests: the workspace default members (xtask
      # and every pure libs/* crate). `cargo xtask test` runs `cargo test` over
      # the same set.
      - name: clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Host unit tests
        run: cargo xtask test

      - name: Build kernel
        run: cargo xtask build

  # Enforce the unsafe-code policy (ADR 0007).
  unsafe-policy:
    name: Unsafe policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check unsafe is confined to hal
        run: ./scripts/check-unsafe.sh

  # House style: no en or em dashes anywhere in the repository.
  dash-policy:
    name: Dash policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for en and em dashes
        run: ./scripts/check-dashes.sh

  # Supply-chain: advisories, licenses, sources, bans.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  # Boot the ISO headless in QEMU and assert the kernel prints its marker over
  # serial. Covers both firmware paths (BIOS boot is reliable on Linux runners).
  boot-test:
    name: Boot test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [bios, uefi]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - name: Install QEMU, xorriso, and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso ovmf
      - name: Build ISO
        run: cargo xtask iso
      - name: Boot test
        run: ./scripts/boot-test.sh ${{ matrix.mode }}
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.mode }}
          path: build/serial-*.log
          if-no-files-found: ignore
