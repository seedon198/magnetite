name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (#113): the jobs only read the repository. With no
# `permissions` block the token would get the repository default, which can be
# write on pushes to main, while the boot test runs third-party code (the
# Limine Makefile, build scripts).
permissions:
  contents: read

# Every action is pinned to a full commit SHA, with its version in a comment, so
# a re-pointed tag cannot change what runs (#26). Dependabot proposes updates.

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
# NOTE: do not set a global RUSTFLAGS here. As an env var it *replaces* (does
# not merge with) the `[target.x86_64-unknown-none]` rustflags in
# .cargo/config.toml, which carry the kernel's linker script and relocation
# model - clobbering them breaks the higher-half link. Warnings are gated by
# the clippy steps below (`-D warnings`), which also catch rustc warnings.

jobs:
  # Format, lint, and cross-compile the kernel. The toolchain, components and
  # target are pinned by rust-toolchain.toml, which `rustup show` installs.
  build-lint:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps (#113).
          persist-credentials: false

      - name: Install pinned toolchain (from rust-toolchain.toml)
        run: |
          rustup show
          rustc --version && cargo --version

      - name: rustfmt
        run: cargo fmt --all --check

      # Bare-metal crates: lint for the kernel target. No `--all-targets`: the
      # test harness needs std and cannot build for a no_std bare-metal target.
      - name: clippy (bare metal)
        run: >
          cargo clippy
          -p kernel -p hal -p boot-info -p sys -p user-root -p user-fault
          --target x86_64-unknown-none
          -- -D warnings

      # Host crates and their unit tests: the workspace default members (xtask
      # and every pure libs/* crate). `cargo xtask test` runs `cargo test` over
      # the same set.
      - name: clippy (host)
        run: cargo clippy --all-targets -- -D warnings

      - name: Host unit tests
        run: cargo xtask test

      - name: Build kernel
        run: cargo xtask build

      # Every global_asm! entry point must be a .text symbol, in the normal
      # build and with one codegen unit, which is how a stray section switch
      # once put the syscall stubs in .rodata (#137, #138).
      - name: asm entry points in .text
        run: ./scripts/check-asm-sections.sh

  # Enforce the unsafe-code policy (ADR 0007).
  unsafe-policy:
    name: Unsafe policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps (#113).
          persist-credentials: false
      - name: Check unsafe is confined to hal
        run: ./scripts/check-unsafe.sh

  # House style: no en or em dashes anywhere in the repository.
  dash-policy:
    name: Dash policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps (#113).
          persist-credentials: false
      - name: Check for en and em dashes
        run: ./scripts/check-dashes.sh

  # Supply-chain: advisories, licenses, sources, bans.
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps (#113).
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  # Boot the ISO headless in QEMU and assert the kernel prints its marker over
  # serial. Covers both firmware paths (BIOS boot is reliable on Linux runners),
  # and UEFI with no PIT, where timer calibration must fall back (#109).
  boot-test:
    name: Boot test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `uefi-release` boots the release-profile kernel (#141): optimizer-only
        # bugs, such as asm register allocation, show up only there.
        mode: [bios, uefi, uefi-nopit, uefi-release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the token in .git/config for later steps (#113).
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show
      - name: Install QEMU, xorriso, and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 xorriso ovmf
      - name: Build ISO
        env:
          KERNEL_PROFILE: ${{ endsWith(matrix.mode, '-release') && 'release' || 'dev' }}
        run: cargo xtask iso
      - name: Boot test
        env:
          MODE: ${{ matrix.mode }}
        run: ./scripts/boot-test.sh "${MODE%-release}"
      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-${{ matrix.mode }}
          path: build/serial-*.log
          if-no-files-found: ignore
