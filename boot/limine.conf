# Limine bootloader configuration. Placed at /boot/limine/limine.conf on the ISO.
# See docs/adr/0003-bootloader.md.

# Boot immediately; this is a single-purpose image.
timeout: 0

/kernel
    # Boot our kernel with the Limine boot protocol.
    protocol: limine

    # boot():/ is the partition that holds this config.
    kernel_path: boot():/boot/kernel

    # KASLR (#47): the kernel is a PIE, so Limine slides it to a random base
    # each boot and applies its RELATIVE relocations. Also randomize the HHDM
    # base (the kernel reads hhdm_offset dynamically, so this is free for us).
    kaslr: yes
    randomise_hhdm_base: yes

    # User programs (#82, ADR 0019), loaded as boot modules. The kernel finds
    # them by the last component of their path.
    module_path: boot():/boot/root
    module_path: boot():/boot/fault
