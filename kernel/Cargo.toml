[package]
name = "kernel"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The hardened, capability-based microkernel."
publish = false

[dependencies]
hal = { path = "../hal" }
boot-info = { path = "../libs/boot-info" }
capability = { path = "../libs/capability" }
sched = { path = "../libs/sched" }
ipc = { path = "../libs/ipc" }
# Bootloader protocol bindings. Wrapped behind our own BootInfo (ADR 0003);
# used only in the kernel's `boot` module. Pinned to 0.5.x: 0.6+ requires a
# nightly-only feature (ptr_metadata), and we stay on stable (ADR 0002).
limine = "0.5.0"
