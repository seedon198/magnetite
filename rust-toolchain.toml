# Pinned to an exact release so every contributor and CI build uses the same
# compiler and lints (#114): `stable` would follow each new release, and a new
# clippy lint under `-D warnings` could turn main red with no code change. Bump
# it deliberately, in its own PR, fixing whatever the new release flags.
# If a custom target spec and -Zbuild-std become necessary (ADR 0002), switch
# `channel` to a pinned nightly and add: components = ["rust-src"].
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["x86_64-unknown-none"]
