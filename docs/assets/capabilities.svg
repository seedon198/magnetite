amily="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Frame</text><rect x="380.2" y="280" width="31.8" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="396.1" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">MAP</text><rect x="329.2" y="280" width="45.0" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="351.7" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">WRITE</text><rect x="284.8" y="280" width="38.4" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="304.0" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">READ</text><rect x="84" y="312" width="344" height="34" rx="6" fill="#161b23" stroke="#3a4250" stroke-width="1.2" stroke-dasharray="5 4"/><text x="100" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#9198a1" text-anchor="start">6</text><text x="122" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">empty slot</text><path d="M 84 169.0 C 52 169.0, 52 209.0, 82 209.0" fill="none" stroke="#e0b062" stroke-width="1.6"/><polygon points="76,204.5 76,213.5 84,209.0" fill="#e0b062"/><text x="44" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e0b062" text-anchor="start">Slot 3 was derived from slot 2: SEND only, badged. Deriving can only remove rights, never add them.</text><rect x="476" y="24" width="380" height="360" rx="10" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="496" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Kernel objects</text><text x="836" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">physical memory, via the HHDM</text><rect x="496" y="72" width="290" height="74" rx="6" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="510" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Untyped</text><text x="510" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">a region of free RAM, bump-allocated</text><rect x="510" y="122" width="262" height="10" rx="3" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><rect x="510" y="122" width="110.03999999999999" height="10" rx="3" fill="#7fa6e8" stroke="#7fa6e8" stroke-width="1.2"/><text x="772" y="142" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#9198a1" text-anchor="end">watermark</text><rect x="496" y="160" width="290" height="44" rx="6" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="510" y="179" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">CNode</text><text x="510" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">slots holding capabilities</text><rect x="496" y="214" width="290" height="44" rx="6" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="510" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Endpoint</text><text x="510" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">synchronous IPC rendezvous (#81)</text><rect x="496" y="268" width="290" height="44" rx="6" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="510" y="287" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Notification</text><text x="510" y="303" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">asynchronous signal word</text><rect x="496" y="322" width="290" height="44" rx="6" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="510" y="341" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Frame</text><text x="510" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">one physical page, mappable</text><path d="M 786 109 H 808 V 344" fill="none" stroke="#7fa6e8" stroke-width="1.4"/><path d="M 808 182 H 795" fill="none" stroke="#7fa6e8" stroke-width="1.4"/><polygon points="795,177.5 795,186.5 787,182" fill="#7fa6e8"/><path d="M 808 236 H 795" fill="none" stroke="#7fa6e8" stroke-width="1.4"/><polygon points="795,231.5 795,240.5 787,236" fill="#7fa6e8"/><path d="M 808 290 H 795" fill="none" stroke="#7fa6e8" stroke-width="1.4"/><polygon points="795,285.5 795,294.5 787,290" fill="#7fa6e8"/><path d="M 808 344 H 795" fill="none" stroke="#7fa6e8" s