<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" width="880" height="580" role="img" aria-label="Magnetite virtual address space: kernel image, heap, LAPIC, HHDM, hole, user space"><title>Magnetite virtual address space: kernel image, heap, LAPIC, HHDM, hole, user space</title><rect width="880" height="580" rx="12" fill="#0f1218"/><text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Virtual address space</text><text x="856" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">high addresses at the top · not to scale</text><rect x="214" y="64" width="512" height="112" rx="4" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="228" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Kernel image</text><text x="228" y="101" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">randomized base in the top 2 GiB (KASLR)</text><text x="24" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0xffffffff80000000</text><rect x="228" y="110" width="484" height="18" rx="3" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="238" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#e6e9ef" text-anchor="start">.text</text><rect x="681.4" y="110" width="18.6" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="690.7" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">X</text><rect x="658.8" y="110" width="18.6" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="668.1" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">R</text><rect x="228" y="131" width="484" height="18" rx="3" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="238" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#e6e9ef" text-anchor="start">.rodata</text><rect x="674.8" y="131" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="687.4" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">NX</text><rect x="652.2" y="131" width="18.6" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="661.5" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">R</text><rect x="228" y="152" width="484" height="18" rx="3" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="238" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#e6e9ef" text-anchor="start">.data .bss</text><rect x="674.8" y="152" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="687.4" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">NX</text><rect x="645.6" y="152" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="658.2" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">RW</text><text x="742" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7fb88a" text-anchor="start">W^X: no page is both</text><text x="742" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">writable and executable,</text><text x="742" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="start">verified at boot</text><rect x="214" y="184" width="512" height="48" rx="4" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="228" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Kernel heap</text><text x="228" y="221" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">grows up on demand, capped below the KASLR window</text><text x="24" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0xffffff8000000000</text><rect x="742" y="194" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="754.6" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">RW</text><rect x="773.2" y="194" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="785.8" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">NX</text><rect x="214" y="240" width="512" height="44" rx="4" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="228" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">LAPIC registers</text><text x="228" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">one uncached page for the timer</text><text x="24" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0xfffffe0000000000</text><rect x="742" y="250" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="754.6" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">RW</text><rect x="773.2" y="250" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="785.8" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">NX</text><rect x="804.4000000000001" y="250" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="817.0" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">UC</text><rect x="214" y="292" width="512" height="44" rx="4" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="228" y="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">Kernel stacks</text><text x="228" y="329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">16 KiB per thread, unmapped guard page below</text><text x="24" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0xfffffd0000000000</text><rect x="742" y="302" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="754.6" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">RW</text><rect x="773.2" y="302" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="785.8" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">NX</text><rect x="214" y="344" width="512" height="48" rx="4" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="228" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">HHDM</text><text x="228" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">direct map of all physical RAM</text><text x="24" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0xffff800000000000</text><rect x="742" y="354" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="754.6" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">RW</text><rect x="773.2" y="354" width="25.2" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="785.8" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fb88a" text-anchor="middle">NX</text><rect x="214" y="400" width="512" height="40" rx="4" fill="#161b23" stroke="#3a4250" stroke-width="1.2" stroke-dasharray="5 4"/><text x="228" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="start">Non-canonical hole</text><text x="228" y="437" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">any access raises #GP</text><text x="24" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0x0000800000000000</text><rect x="214" y="448" width="512" height="56" rx="4" fill="#18213a" stroke="#7fa6e8" stroke-width="1.2"/><text x="228" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6e9ef" text-anchor="start">User space</text><text x="228" y="485" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">one per task: code at 0x400000, stack below 0x80000000</text><text x="24" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0x0000000000001000</text><rect x="742" y="458" width="18.6" height="18" rx="9" fill="#1d2330" stroke="#4a5568" stroke-width="1.2"/><text x="751.3" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#7fa6e8" text-anchor="middle">U</text><rect x="214" y="512" width="512" height="44" rx="4" fill="#161b23" stroke="#3a4250" stroke-width="1.2" stroke-dasharray="5 4"/><text x="228" y="532" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#9198a1" text-anchor="start">Unmapped</text><text x="228" y="549" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">catches NULL dereferences</text><text x="24" y="550" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="start">0x0000000000000000</text><path d="M 206 64 H 200 V 392 H 206" fill="none" stroke="#7fa6e8" stroke-width="1.4"/><text x="192" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#7fa6e8" text-anchor="middle" transform="rotate(-90 192 228.0)">kernel half: same in every address space</text></svg>
