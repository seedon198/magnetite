<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-label="Timer interrupt and preemption path"><title>Timer interrupt and preemption path</title><rect width="880" height="428" rx="12" fill="#0f1218"/><rect x="24" y="24" width="832" height="65" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="51" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">timer IRQ, vector 0x30</text><text x="836" y="51" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">LAPIC · every 10 ms</text><text x="60" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">common_stub builds a TrapFrame on the current thread's stack</text><line x1="64" y1="89" x2="64" y2="122" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,121 69,121 64,129" fill="#7fa6e8"/><rect x="24" y="129" width="832" height="149" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e6e9ef" text-anchor="start">timer_interrupt</text><text x="836" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#9198a1" text-anchor="end">kernel/src/main.rs</text><text x="60" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#7fa6e8" text-anchor="end">1</text><text x="70" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">TICKS += 1</text><text x="60" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#7fa6e8" text-anchor="end">2</text><text x="70" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">lapic::eoi()</text><text x="167.0" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">before switching: the next thread may run a whole slice first</text><text x="60" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#7fa6e8" text-anchor="end">3</text><text x="70" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">ring 3 too</text><text x="152.5" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">a tick in user mode preempts the same way: each thread has its own kernel stack</text><text x="60" y="243" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#7fa6e8" text-anchor="end">4</text><text x="70" y="243" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">pick_next()</text><text x="159.75" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">SCHED.lock(), rotate round-robin; the lock is released here</text><text x="60" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#7fa6e8" text-anchor="end">5</text><text x="70" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">context::switch(cur, next)</text><text x="268.5" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">cur's TrapFrame stays on its own stack</text><line x1="64" y1="278" x2="64" y2="311" stroke="#7fa6e8" stroke-width="1.6"/><polygon points="59,310 69,310 64,318" fill="#7fa6e8"/><text x="80" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7fa6e8" text-anchor="start">other threads run; a later tick picks cur again</text><rect x="24" y="318" width="832" height="86" rx="8" fill="#161b23" stroke="#4a5568" stroke-width="1.2"/><text x="44" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#e6e9ef" text-anchor="start">resume cur</text><text x="60" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="369" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">switch returns</text><text x="181.5" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">into the handler, which returns to common_stub</text><text x="60" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7fa6e8" text-anchor="end">·</text><text x="70" y="390" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#e6e9ef" text-anchor="start">iretq</text><text x="116.25" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">restores the TrapFrame; cur continues where it was interrupted</text></svg>
